<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta - Bitácora de Viaje</title>
 
    <!--Tailwind CSS (misma forma que tenías)-->
    <script src="https://cdn.tailwindcss.com"></script>
 
    <!--Rediseño de la paleta: abandonamos el estilo futurista/oscuro-->
    <!--Nueva identidad: Eco-Friendly / Minimalista-->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ecoBg:      '#f7f6f2',
                        ecoCard:    '#ffffff',
                        ecoGreen:   '#059669',
                        ecoGreenDk: '#065f46',
                        ecoGreenLt: '#ecfdf5',
                        ecoStone:   '#57534e',
                        ecoBorder:  '#e7e5e4',
                        ecoMuted:   '#a8a29e',
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body:    ['"Nunito"', 'sans-serif'],
                    },
                    boxShadow: {
                        card: '0 1px 4px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
 
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
 
<body class="bg-ecoBg min-h-screen flex items-start justify-center p-4 pt-12 font-body antialiased">
 
    <div class="w-full max-w-lg">
 
        <!--ENCABEZADO-->
        <header class="mb-8">
            <div class="flex items-center gap-2 mb-3">
                <div class="w-7 h-7 rounded-full bg-ecoGreenLt flex items-center justify-center">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 1C4.5 1 2 4 2 8s2.5 7 6 7 6-3 6-7S11.5 1 8 1z" fill="#059669" opacity="0.3"/>
                        <path d="M8 3c0 0-3.5 2.5-3.5 S6 13 8 13s3.5-2 3.5-4.5S8 3 8 3z" fill="#059669" opacity="0.7"/>
                        <line x1="8" y1="5" x2="8" y2="11" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="5.5" y1="8" x2="10.5" y2="8" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="text-xs font-semibold tracking-widest uppercase text-ecoGreen">EcoRuta Logistics</span>
            </div>
            <h1 class="font-display text-4xl font-semibold text-ecoGreenDk leading-tight">
                Bitácora de<br>Combustible
            </h1>
            <p class="text-sm text-ecoStone mt-2">Registrá cada carga del viaje y calculá el consumo total.</p>
        </header>
 
        <!--SECCIÓN 1: FORMULARIO DE NUEVA CARGA-->
        <div class="bg-ecoCard border border-ecoBorder rounded-2xl p-6 shadow-card mb-4">
 
            <p class="text-xs font-semibold tracking-widest uppercase text-ecoMuted mb-5">Nueva carga</p>
 
            <div class="grid grid-cols-2 gap-4 mb-5">
 
                <div class="relative">
                    <label class="text-xs text-ecoGreenDk font-semibold uppercase tracking-wider pl-1 mb-1 block">
                        Kilometraje actual
                    </label>
                    <input type="number" id="km" placeholder="ej. 45820" min="0" step="1"
                        class="input-eco w-full pr-10">
                    <span class="input-hint">km</span>
                </div>
 
                <div class="relative">
                    <label class="text-xs text-ecoGreenDk font-semibold uppercase tracking-wider pl-1 mb-1 block">
                        Litros cargados
                    </label>
                    <input type="number" id="litros" placeholder="ej. 62.5" min="0.1" step="0.1"
                        class="input-eco w-full pr-10">
                    <span class="input-hint">L</span>
                </div>
            </div>
 
            <!--Mensaje de error (oculto por defecto con clase "hidden" de Tailwind)-->
            <p id="error-msg" class="hidden text-xs text-red-700 bg-red-50 rounded-lg px-3 py-2 mb-4"></p>
 
            <button onclick="agregarCarga()"
                class="w-full bg-ecoGreen hover:bg-ecoGreenDk text-white font-semibold rounded-full py-3 text-sm tracking-wide transition duration-200 active:scale-[0.98]">
                + Agregar Carga
            </button>
        </div>
 
        <!--SECCIÓN 2: TABLA DE REGISTROS-->
        <!--hidden = clase Tailwind para display:none. Se quita desde JS-->
        <div id="registros-section" class="hidden mb-4">
 
            <p class="text-xs font-semibold tracking-widest uppercase text-ecoMuted mb-3">Cargas registradas</p>
 
            <div class="bg-ecoCard border border-ecoBorder rounded-2xl shadow-card overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-ecoGreenLt">
                        <tr>
                            <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-ecoGreenDk">#</th>
                            <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-ecoGreenDk">Kilometraje</th>
                            <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-ecoGreenDk">Litros</th>
                            <th class="px-4 py-3"></th>
                        </tr>
                    </thead>
                    <!--tbody se llena dinámicamente desde script.js-->
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
 
            <div class="flex justify-end mt-4">
                <button onclick="finalizarViaje()"
                    class="border border-ecoGreen text-ecoGreenDk font-semibold rounded-full px-6 py-2.5 text-sm hover:bg-ecoGreenLt transition duration-200 active:scale-[0.98]">
                    Finalizar Viaje y Calcular
                </button>
            </div>
        </div>
 
        <!--SECCIÓN 3: PANEL DE RESULTADO-->
        <!--Reemplaza al <div id="resultado"> original-->
        <div id="resultado" class="hidden">
 
            <p class="text-xs font-semibold tracking-widest uppercase text-ecoMuted mb-3">Resumen del viaje</p>
 
            <div class="grid grid-cols-3 gap-3 mb-3">
 
                <div class="bg-ecoCard border border-ecoBorder rounded-xl p-4 text-center shadow-card">
                    <p class="text-xs uppercase tracking-wider text-ecoMuted mb-1">Distancia</p>
                    <p id="res-distancia" class="font-display text-2xl font-semibold text-ecoGreenDk">—</p>
                    <p class="text-xs text-ecoMuted mt-1">km</p>
                </div>
 
                <div class="bg-ecoCard border border-ecoBorder rounded-xl p-4 text-center shadow-card">
                    <p class="text-xs uppercase tracking-wider text-ecoMuted mb-1">Litros</p>
                    <p id="res-litros" class="font-display text-2xl font-semibold text-ecoGreenDk">—</p>
                    <p class="text-xs text-ecoMuted mt-1">total</p>
                </div>
 
                <div class="bg-ecoGreenLt border border-green-200 rounded-xl p-4 text-center shadow-card">
                    <p class="text-xs uppercase tracking-wider text-ecoGreen font-semibold mb-1">Consumo</p>
                    <p id="res-consumo" class="font-display text-2xl font-semibold text-ecoGreenDk">—</p>
                    <p class="text-xs text-ecoGreen mt-1">L/100km</p>
                </div>
            </div>
 
            <p id="res-meta" class="text-xs text-center text-ecoMuted mb-5"></p>
 
            <div class="text-center">
                <button onclick="resetearViaje()"
                    class="text-xs text-ecoMuted underline underline-offset-2 hover:text-ecoStone transition">
                    Iniciar nuevo viaje
                </button>
            </div>
        </div>
 
    </div>
 
    <script src="script.js"></script>
</body>
</html>
